gateway:
  host: 0.0.0.0
  port: 8080
  api_key: ${GATEWAY_API_KEY}

cache:
  # enabled: キャッシュを使うか（環境変数 GATEWAY_CACHE_ENABLED で上書きできる）
  enabled: true
  # local_only: true = ローカルモデル（Ollama）の答えだけキャッシュする / false = 外部の LLM の答えもキャッシュする
  #   （環境変数 GATEWAY_CACHE_LOCAL_ONLY で上書きできる。どちらでも app と tenant が一致する範囲だけ）
  local_only: true
  similarity_threshold: 0.92
  default_ttl_hours: null    # null = 無期限

router:
  local_confidence_threshold: 0.85
  fallback_to_external: true

llm:
  default_provider: claude
  providers:
    claude:
      model: claude-sonnet-4-6
      api_key: ${ANTHROPIC_API_KEY}
    openai:
      model: gpt-4o-mini
      api_key: ${OPENAI_API_KEY}
    ollama:
      model: llama3.1:8b
      base_url: ${OLLAMA_BASE_URL}
    gemini:
      model: gemini-2.0-flash
      api_key: ${GOOGLE_API_KEY}

finetuning:
  schedule: "0 2 * * 0"     # 毎週日曜 2:00 AM
  min_samples: 500
  quality_threshold: 0.8
  lora_rank: 16

knowledge:
  # 質問と答えを貯める（ファインチューニングの材料）。外部の LLM の答えも残るため、既定では止める
  enabled: false
  local_only: true

status:
  # 認証なしのステータスページ（GET / と GET /stats）を出すか
  public: false
